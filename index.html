<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>考试大师 · 网页版</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='10' fill='%233D7EFF'/%3E%3Cpath d='M21 7 10 22h7l-2 11 12-15h-7z' fill='%23fff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css">
</head>
<body class="is-auth">

<!-- ==================== 登录 / 注册分屏 ==================== -->
<div class="auth-stage" id="authStage" data-theme="campus">
  <div class="auth-switch" role="group" aria-label="切换登录页样式">
    <button type="button" data-auth-theme="campus" aria-pressed="true">校园插画</button>
    <button type="button" data-auth-theme="desk" aria-pressed="false">沉浸书桌</button>
    <button type="button" data-auth-theme="student" aria-pressed="false">3D 学习人物</button>
  </div>
  <div class="auth-layout">
    <section class="auth-brand" aria-label="考试大师">
      <div class="auth-brand-inner">
        <p class="auth-brand-name">考试大师</p>
        <h1>把每一次练习，<br>都变成确定的进步。</h1>
      </div>
    </section>
    <section class="auth-panel" aria-label="登录">
      <div class="auth-card" id="authCard"></div>
      <p class="auth-tip">演示账号：任意 11 位手机号 + 验证码 <b>1234</b> · 课程激活码 <b>JQ2026</b></p>
    </section>
  </div>
</div>

<!-- ==================== 应用主体 ==================== -->
<div class="app-shell" id="appShell">

  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-logo"><svg viewBox="0 0 24 24"><path d="M13 3 6 13.5h5L10 21l8-11h-5.5z"/></svg></div>
      <div class="brand-txt"><b>考试大师</b></div>
    </div>

    <nav class="nav-main" id="tabbar" aria-label="主导航">
      <button class="tb" data-tab="home" aria-label="首页" title="首页" onclick="goTab('home')"><svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7"/><path d="M6 9.5V20h12V9.5"/></svg><span>首页</span></button>
      <div class="side-group" data-side-group="discover" data-expanded="true">
        <div class="side-group-heading">
          <button type="button" class="side-category" aria-expanded="true" aria-controls="side-sub-discover"><svg class="side-category-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M15 9l-2 4.5L8.5 15l2-4.5z"/></svg><span>发现</span><svg class="side-category-arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="m7 10 5 5 5-5"/></svg></button>
        </div>
        <div class="side-sub" id="side-sub-discover">
          <button type="button" data-side-page="pagePapers" onclick="openSidePage('discover','pagePapers')">试卷</button>
          <button type="button" data-side-page="pageTextbook" onclick="openSidePage('discover','pageTextbook')">个性化教材</button>
          <button type="button" data-side-page="pageMaterials" onclick="openSidePage('discover','pageMaterials')">资料领取</button>
          <button type="button" data-side-page="pageAiTest" onclick="openSidePage('discover','pageAiTest')">AI 测评</button>
        </div>
      </div>
      <button class="tb" data-tab="qa" aria-label="在线答疑" title="在线答疑" onclick="goTab('qa')"><svg viewBox="0 0 24 24"><path d="M4 6h16v11H9l-5 4z"/><path d="M8.5 10h7M8.5 13h4"/></svg><span>在线答疑</span></button>
      <button class="tb" data-tab="me" aria-label="我的" title="我的" onclick="goTab('me')"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M8.5 13.5c1 1.4 2.2 2 3.5 2s2.5-.6 3.5-2"/><path d="M9 9.5h.01M15 9.5h.01"/></svg><span>我的</span></button>
    </nav>

    <details class="side-demo">
      <summary>流程演示</summary>
      <p class="side-demo-note">纯前端演示，数据保存在本机。验证码 1234 · 激活码 JQ2026</p>
      <div class="mods" id="mods"></div>
    </details>

    <div class="side-foot">
      <button class="reset-btn" onclick="resetDemo()"><svg viewBox="0 0 24 24"><path d="M4 11a8 8 0 1 1 2.4 6"/><path d="M4 5v6h6"/></svg>重置演示数据</button>
      <div class="side-ver">v1.0 Web · 纯前端演示</div>
    </div>
  </aside>

  <div class="main-col">
    <header class="topbar">
      <div class="top-location">
        <button type="button" class="icon-btn side-toggle" id="sideToggle" aria-controls="sidebar" aria-expanded="true" aria-label="收起侧边栏" title="收起侧边栏">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M9 5v14"/></svg>
        </button>
        <div class="crumb" id="crumb"><span class="crumb-root">考试大师</span><span class="crumb-sep">/</span><b>首页</b></div>
      </div>
      <div class="top-actions">
        <div class="searchbox">
          <svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/></svg>
          <input id="searchInput" placeholder="搜索页面、课程、功能…" autocomplete="off">
          <kbd>/</kbd>
          <div class="search-results" id="searchResults"></div>
        </div>
        <span class="top-clock" id="clock"></span>
        <button class="icon-btn" title="通知" onclick="openNotifications()"><svg viewBox="0 0 24 24"><path d="M18 9a6 6 0 0 0-12 0c0 6-2 7-2 7h16s-2-1-2-7"/><path d="M10 20a2 2 0 0 0 4 0"/></svg><i></i></button>
        <button class="user-chip" onclick="goTab('me')"><span class="user-av" id="topAvatar">张</span><span class="user-nm" id="topName">张真同学</span><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>
      </div>
    </header>

    <div class="workspace">
      <main class="content">
        <div class="screen" id="screen"></div>
      </main>

    </div>
  </div>
</div>

<div id="hint"></div>
<div id="toast"></div>
<div id="modal-root" onclick="if(event.target.classList.contains('mask'))closeModal()"><div class="mask"></div><div class="sheet" id="sheet"></div></div>

<script src="app.js"></script>
</body>
</html>
